<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>War Table · Sound Lab</title>
    <style>
      :root {
        --bg: #0c0f13;
        --panel: rgba(18, 22, 28, 0.9);
        --line: rgba(194, 160, 98, 0.28);
        --brass: #c2a062;
        --ivory: #f3ead8;
        --muted: rgba(243, 234, 216, 0.62);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--ivory); }
      body {
        font-family: 'Inter Variable', system-ui, sans-serif;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        background: radial-gradient(1200px 600px at 50% -10%, #1b1712 0%, var(--bg) 60%);
        min-height: 100vh;
      }
      main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 48px; }
      h1 { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 0.14em; font-size: 26px; margin: 0; }
      h2 { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 0.12em; font-size: 13px; color: var(--brass); margin: 22px 0 10px; }
      .sub { color: var(--muted); margin: 6px 0 18px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
      .controls { display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: center; }
      .controls label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      .controls output { color: var(--ivory); min-width: 3.2em; }
      input[type='range'] { accent-color: var(--brass); width: 130px; }
      select { background: #12151a; color: var(--ivory); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
      button {
        font: inherit; color: var(--ivory); background: #151a20; border: 1px solid var(--line);
        border-radius: 8px; padding: 10px 12px; text-align: left; cursor: pointer;
        transition: background 100ms, transform 60ms;
      }
      button:hover { background: #1c232b; }
      button:active { transform: scale(0.97); }
      button.primary { background: var(--brass); color: #1b140a; border-color: var(--brass); font-weight: 600; }
      button.on { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
      .sfx b { display: block; font-weight: 600; }
      .sfx small { display: block; color: var(--muted); margin-top: 3px; font-size: 11.5px; }
      .sfx .m { color: var(--brass); }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      canvas { display: block; width: 100%; border-radius: 8px; background: #080a0d; }
      #status { color: var(--muted); font-size: 12px; margin-top: 8px; min-height: 1.4em; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { padding: 5px 6px; border-bottom: 1px solid rgba(243, 234, 216, 0.08); text-align: right; }
      th:first-child, td:first-child { text-align: left; }
      th { color: var(--brass); font-weight: 600; }
      td.bad { color: #f08a7f; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/audio/lab.ts"></script>
  </body>
</html>
