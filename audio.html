<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101a30" />
    <title>War Table · Sound</title>
    <style>
      :root {
        --paper: #101a30;
        --deep: #0b1224;
        --fibre: #1b2a48;
        --ink: #e2ddcf;
        --text: #f0ebe0;
        --muted: rgba(240, 235, 224, 0.62);
        --hair: rgba(226, 221, 207, 0.2);
        --gold: #c9a961;
        --gold-hair: rgba(201, 169, 97, 0.55);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); color: var(--text); }
      body {
        font-family: 'Cormorant Garamond Variable', 'Cormorant Garamond', Georgia, serif;
        font-weight: 500;
        font-size: 17px;
        font-variant-numeric: lining-nums tabular-nums;
        background: radial-gradient(1400px 800px at 50% -20%, var(--fibre) 0%, var(--paper) 55%, var(--deep) 100%);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 1180px; margin: 0 auto; padding: 36px 24px 64px; }
      h1 {
        font-weight: 600; font-size: 34px; margin: 0; letter-spacing: 0.08em;
        font-variant: small-caps; text-align: center;
      }
      .rule {
        position: relative; height: 1px; margin: 16px auto 10px; max-width: 520px;
        background: linear-gradient(90deg, transparent, var(--gold-hair) 22%, var(--gold-hair) 42%, transparent 44%, transparent 56%, var(--gold-hair) 58%, var(--gold-hair) 78%, transparent);
      }
      .rule::after {
        content: ''; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
        margin: -11px 0 0 -11px; border: 1.5px solid var(--gold); border-radius: 50%;
      }
      h2 {
        font-weight: 600; font-size: 20px; letter-spacing: 0.08em; font-variant: small-caps;
        color: var(--ink); margin: 30px 0 10px; display: flex; gap: 14px; align-items: baseline;
      }
      h2 span { font-variant: normal; letter-spacing: 0; font-weight: 500; font-size: 16px; color: var(--muted); }
      .sub { color: var(--muted); margin: 8px auto 20px; text-align: center; max-width: 720px; }
      .panel { border: 1px solid var(--hair); border-radius: 14px; padding: 14px 18px; background: rgba(11, 18, 36, 0.4); }
      .controls { display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; justify-content: center; }
      .controls label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      .controls output { color: var(--text); min-width: 3.4em; }
      input[type='range'] { accent-color: var(--gold); width: 120px; }
      select { font: inherit; background: var(--deep); color: var(--text); border: 1px solid var(--hair); border-radius: 8px; padding: 2px 8px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
      button {
        font: inherit; color: var(--text); background: transparent; border: 1px solid var(--hair);
        border-radius: 12px; padding: 10px 14px; text-align: left; cursor: pointer;
        transition: color 120ms, border-color 120ms; -webkit-tap-highlight-color: transparent;
      }
      button:hover { border-color: rgba(226, 221, 207, 0.4); }
      button:active { color: rgba(240, 235, 224, 0.8); }
      button.pill { border-radius: 999px; padding: 7px 16px; text-align: center; }
      button.gold, button.on { border-color: var(--gold); color: var(--gold); }
      .sfx b { display: block; font-weight: 600; font-size: 18px; }
      .sfx small { display: block; color: var(--muted); margin-top: 2px; font-size: 14px; }
      .sfx .m { color: var(--gold); }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      canvas { display: block; width: 100%; border-radius: 10px; background: var(--deep); }
      #status { color: var(--muted); margin-top: 8px; min-height: 1.4em; }
      #table { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 15px; }
      th, td { padding: 5px 7px; border-bottom: 1px solid rgba(240, 235, 224, 0.08); text-align: right; white-space: nowrap; }
      th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
      th { color: var(--ink); font-weight: 600; font-variant: small-caps; letter-spacing: 0.04em; }
      td.bad { color: var(--gold); white-space: normal; text-align: left; }
      @media (max-width: 640px) {
        main { padding: 24px 14px 48px; }
        h1 { font-size: 28px; }
        .grid { grid-template-columns: 1fr 1fr; }
        input[type='range'] { width: 96px; }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/audio/lab.ts"></script>
  </body>
</html>
