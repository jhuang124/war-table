<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The game provides its own zoom (pinch on the board) and a Text size setting (docs/MOBILE.md §2). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1224" />
    <meta name="description" content="The classic game of world conquest, for 2 to 4 players around one screen." />
    <title>War Table</title>
    <!-- Installed app: manifest + icons (public/), status bar over the board. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="War Table" />
    <meta name="format-detection" content="telephone=no" />
    <!-- One family (docs/INK.md B3): Cormorant Garamond, copied from @fontsource-variable to public/fonts so
         it can be preloaded at a stable URL with font-display: block (no font swap on a cold load). -->
    <link rel="preload" href="/fonts/cormorant-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Device class before first paint (src/ui/layout.ts keeps it current): no desktop-layout flash on a
      // phone. By capability and viewport size, never the user agent.
      (function () {
        var w = innerWidth, h = innerHeight, c = document.documentElement.classList;
        var coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
        var phone = Math.min(w, h) <= 540 && Math.max(w, h) <= 1000;
        c.add(phone ? 'form-phone' : coarse ? 'form-tablet' : 'form-desktop', h > w ? 'portrait' : 'landscape');
        if (coarse) c.add('touch');
        if (h > w && (phone || (coarse && w < 1100))) c.add('dock-stacked');
      })();
    </script>
    <style>
      @font-face {
        font-family: 'Cormorant Garamond Variable';
        font-style: normal;
        font-display: block;
        font-weight: 300 700;
        src: url(/fonts/cormorant-garamond-latin-wght-normal.woff2) format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

        font-weight: 300 700;

      }
      @font-face {
        font-family: 'Cormorant Garamond Variable';
        font-style: italic;
        font-display: swap;
        font-weight: 300 700;
        src: url(/fonts/cormorant-garamond-latin-wght-italic.woff2) format('woff2-variations');

      }
      /* App shell (docs/MOBILE.md §2): one fixed screen. No page scroll, zoom, rubber-banding,
         pull-to-refresh, text selection, tap highlight or long-press callouts; 100dvh, never 100vh. */
      html, body {
        margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #0b1224;
        overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      body { position: fixed; inset: 0; width: 100%; touch-action: manipulation; }
      #board { position: fixed; inset: 0; touch-action: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      /* Boot splash: the title's own lockup (serif small caps, the gold hairline with the title's ensō at
         its centre), invisible for the first 600 ms so fast boots never flash it; the ensō breathes
         slowly while the board builds (the same 8 s breath as the in-game rule). */
      #boot-splash {
        position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px;
        color: #f0ebe0; font: 500 44px/1 'Cormorant Garamond Variable', Georgia, serif; font-variant: small-caps;
        letter-spacing: 0.08em; opacity: 0; animation: boot-in 300ms ease-out 600ms forwards; pointer-events: none;
        background: radial-gradient(120% 90% at 50% 45%, #121d36, #0b1224);
      }
      #boot-splash i {
        position: relative; display: block; width: min(460px, 76vw); height: 44px;
        background:
          linear-gradient(90deg, rgba(201, 169, 97, 0), #c9a961) left center / calc(50% - 32px) 1px no-repeat,
          linear-gradient(270deg, rgba(201, 169, 97, 0), #c9a961) right center / calc(50% - 32px) 1px no-repeat;
      }
      #boot-splash svg {
        position: absolute; left: 50%; top: 0; width: 44px; height: 44px; margin-left: -22px; color: #c9a961; overflow: visible;
        animation: boot-breathe 8s ease-in-out 600ms infinite alternate;
      }
      /* The installed app starts on the splash straight away (no 600 ms grace: there is no page behind it). */
      @media (display-mode: standalone), (display-mode: fullscreen) {
        #boot-splash { animation-delay: 0ms; }
      }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-breathe { from { opacity: 1; } to { opacity: 0.84; } }
    </style>
  </head>
